    <section class="page-hero" id="pageHero" style="--hero-img:url('{{hero_img}}')">
      <div class="wrap page-hero-inner">
        <nav class="crumbs" aria-label="breadcrumb" id="crumbs"><a href="/" data-i18n="home">الرئيسية</a><span aria-hidden="true">/</span><a href="/collections/" data-i18n="allCollections">جميع الأقسام</a><span aria-hidden="true">/</span><span>{{name}}</span></nav>
        <h1 id="collTitle">{{name}}</h1>
        <p id="collCount"></p>
      </div>
    </section>
    <div class="wrap shop-layout">
      <aside class="shop-side" aria-label="الأقسام" data-i18n-aria="categories">
        <h2 class="side-title" data-i18n="categories">الأقسام</h2>
        <nav class="side-nav" id="sideNav"></nav>
      </aside>
      <div class="shop-main">
        <div class="toolbar">
          <div class="chips" id="subChips" hidden></div>
          <div class="toolbar-row">
            <label class="filter-search"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input type="search" id="filterQ" placeholder="ابحث في هذا القسم" data-i18n-ph="filterPh" aria-label="بحث" data-i18n-aria="search"></label>
            <span class="muted result-count" id="resultCount"></span>
            <label class="sort"><span data-i18n="sortBy">ترتيب حسب</span>
              <select id="sortSel">
                <option value="default" data-i18n="sortDefault">المميز</option>
                <option value="price-asc" data-i18n="sortPriceAsc">السعر: من الأقل</option>
                <option value="price-desc" data-i18n="sortPriceDesc">السعر: من الأعلى</option>
                <option value="name" data-i18n="sortName">الاسم</option>
              </select>
            </label>
          </div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="center"><button class="btn btn-outline" id="moreBtn" type="button" hidden data-i18n="showMore">عرض المزيد</button></div>
        <div class="empty" id="empty" hidden>
          <p data-i18n="noResults">لا توجد منتجات مطابقة.</p>
          <a class="btn" href="/collections/all/" data-i18n="allProducts">جميع المنتجات</a>
        </div>
      </div>
    </div>
