# Filled in by `shopify app config link` (client_id) on first setup.
name = "Conran Date of Birth"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2025-10"

[access_scopes]
scopes = "write_customers,customer_read_customers,customer_write_customers"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

# Customer's date of birth. Customers can set it from their account profile;
# staff can see and edit it on the customer page in Shopify admin.
[customer.metafields.app.date_of_birth]
type = "date"
name = "Date of birth"
description = "Customer's date of birth, entered on their account profile"
access.customer_account = "read_write"
access.admin = "merchant_read_write"
